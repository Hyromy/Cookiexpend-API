[project]
name = "cookiexpend-API"
version = "0.6.3"
description = "Sistema de control y supervisión de inventarios en entornos distribuidos"
authors = [
    {name = "Hyromy",email = "formulajoel9@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "gevent (>=26.4.0,<27.0.0)",
    "django-filter (>=25.2,<26.0)",
    "pillow (>=12.2.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
testing = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["I001", "E501"]
"manage.py" = ["E402"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--reuse-db"
filterwarnings = [
    "ignore:No directory at.*staticfiles:UserWarning",
    "ignore:The HMAC key is .* bytes long",
]
